<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 32 32" width="32" height="32" fill="none">
  <defs>
    <linearGradient id="cai_bg" x1="0%" y1="0%" x2="100%" y2="100%">
      <stop offset="0%" stop-color="#4338ca"/>
      <stop offset="50%" stop-color="#6366f1"/>
      <stop offset="100%" stop-color="#8b5cf6"/>
    </linearGradient>
    <linearGradient id="cai_core" x1="0%" y1="0%" x2="100%" y2="100%">
      <stop offset="0%" stop-color="#ffffff"/>
      <stop offset="100%" stop-color="#c7d2fe"/>
    </linearGradient>
    <filter id="cai_glow" x="-20%" y="-20%" width="140%" height="140%">
      <feDropShadow dx="0" dy="1" stdDeviation="1.5" flood-color="#8b5cf6" flood-opacity="0.35"/>
    </filter>
  </defs>

  <!-- Rounded Squircle Base -->
  <rect width="32" height="32" rx="9" fill="url(#cai_bg)"/>

  <!-- Neural Mesh Pathways -->
  <g filter="url(#cai_glow)">
    <!-- Symmetric synaptic connection arches -->
    <path d="M10 13C10 9.8 12.7 7.5 16 7.5C19.3 7.5 22 9.8 22 13" stroke="rgba(255,255,255,0.45)" stroke-width="1.4" stroke-linecap="round"/>
    <path d="M7.5 16C7.5 20.8 11.2 24.5 16 24.5C20.8 24.5 24.5 20.8 24.5 16" stroke="rgba(255,255,255,0.3)" stroke-width="1.2" stroke-linecap="round" stroke-dasharray="1.5 2.5"/>

    <!-- Geometric inter-node links -->
    <line x1="16" y1="9" x2="16" y2="16" stroke="#ffffff" stroke-width="1.5" stroke-linecap="round"/>
    <line x1="16" y1="16" x2="16" y2="23" stroke="#ffffff" stroke-width="1.5" stroke-linecap="round"/>
    <line x1="9.5" y1="16" x2="16" y2="16" stroke="#ffffff" stroke-width="1.5" stroke-linecap="round"/>
    <line x1="16" y1="16" x2="22.5" y2="16" stroke="#ffffff" stroke-width="1.5" stroke-linecap="round"/>
    <line x1="11.5" y1="11.5" x2="16" y2="16" stroke="#ffffff" stroke-width="1.3" stroke-linecap="round"/>
    <line x1="20.5" y1="11.5" x2="16" y2="16" stroke="#ffffff" stroke-width="1.3" stroke-linecap="round"/>

    <!-- Neural Nodes -->
    <circle cx="16" cy="16" r="3" fill="url(#cai_core)"/>
    <circle cx="16" cy="8.5" r="1.8" fill="#ffffff"/>
    <circle cx="16" cy="23.5" r="1.8" fill="#ffffff"/>
    <circle cx="9" cy="16" r="1.8" fill="#ffffff"/>
    <circle cx="23" cy="16" r="1.8" fill="#ffffff"/>
    <circle cx="11.5" cy="11.5" r="1.4" fill="#e0e7ff"/>
    <circle cx="20.5" cy="11.5" r="1.4" fill="#e0e7ff"/>
  </g>
</svg>
